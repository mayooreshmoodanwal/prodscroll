name: productscroll-services
services:
  api:
    build: { context: ., target: api }
    env_file: .env.production
    environment: { API_PORT: 4000, MEDIA_DRIVER: r2 }
    ports: ["127.0.0.1:4000:4000"]
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    build: { context: ., target: worker }
    env_file: .env.production
    environment: { MEDIA_DRIVER: r2, MEDIA_DIR: /app/work/media }
    restart: unless-stopped
    init: true
    stop_grace_period: 120s
  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set the public HTTPS API URL ending in /api}
        NEXT_PUBLIC_UPLOAD_ORIGINS: ${NEXT_PUBLIC_UPLOAD_ORIGINS:?Set the exact R2 upload and Worker HTTPS origins}
    env_file: .env.production
    environment: { PORT: 3000 }
    ports: ["127.0.0.1:3000:3000"]
    restart: unless-stopped
    init: true
