name: Verify ProductScroll
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: productscroll
          POSTGRES_PASSWORD: productscroll
          POSTGRES_DB: productscroll
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U productscroll"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pnpm install --frozen-lockfile
      - run: node scripts/setup-env.mjs
      - run: pnpm db:generate && pnpm db:validate && pnpm db:migrate && pnpm db:seed
      - run: pnpm lint && pnpm typecheck && pnpm test && pnpm test:integration
      - run: pnpm build
      - name: Export both native bundles
        run: pnpm --filter @productscroll/mobile exec expo export --platform android --platform ios --output-dir ../../work/mobile-dist
        env: { CI: "1", EXPO_NO_TELEMETRY: "1" }
      - name: Start application services
        run: |
          mkdir -p work/logs
          pnpm --parallel --filter @productscroll/api --filter @productscroll/worker start > work/logs/services.log 2>&1 &
          NODE_ENV=production pnpm --filter @productscroll/web start > work/logs/web.log 2>&1 &
          node scripts/wait-ready.mjs
      - run: pnpm test:system
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            playwright-report
            test-results
            work/logs
          retention-days: 7
